<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price War</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap">
<style>
  :root {
    --bg: #ffffff; --text: #1f2328; --muted: #6b7280; --line: #e5e7eb; --head: #f6f7f9;
    --low-bg: #fde2e1; --low-tx: #a4161a; --high-bg: #fff0cc; --high-tx: #8a5a00;
    --oos-tx: #9ca3af; --btn: #1f2328; --btn-tx: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c; --text: #e8eaed; --muted: #9aa0a6; --line: #2c2f35; --head: #1e2126;
      --low-bg: #4a1f22; --low-tx: #ffb3b0; --high-bg: #44360f; --high-tx: #ffd77a;
      --oos-tx: #6b7280; --btn: #e8eaed; --btn-tx: #16181c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 16px 20px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 64px; height: 48px; flex: none; }
  .brand .nh { height: 54px; width: auto; flex: none; }
  .brand .sep { width: 1px; height: 40px; background: var(--line); margin: 0 4px; }
  h1 { font-size: 22px; margin: 0; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; }
  h1 small { display: block; font-size: 11px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); }
  .meta { color: var(--muted); font-size: 13px; flex: 1 1 220px; min-width: 0; }
  .right { display: flex; align-items: center; gap: 16px; margin-left: auto; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
  button { background: var(--btn); color: var(--btn-tx); border: 0; border-radius: 6px;
           padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 0 20px 12px; font-size: 13px; color: var(--muted); }
  .filters label { display: inline-flex; align-items: center; gap: 8px; }
  .filters select, .filters input { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
                                    border-radius: 6px; padding: 6px 10px; min-width: 190px; }
  .filters .clear { background: none; color: var(--muted); border: 1px solid var(--line); font-weight: 500; padding: 6px 12px; }
  td.cat { color: var(--muted); text-align: left; }
  .wrap { overflow: auto; max-height: calc(100vh - 175px); border-top: 1px solid var(--line); }
  table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
  th, td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--head); font-weight: 600; z-index: 2; }
  th:first-child, td:first-child { position: sticky; left: 0; text-align: left; background: var(--bg); z-index: 1; }
  th:first-child { background: var(--head); z-index: 3; }
  td:first-child { font-weight: 600; }
  td.al { color: var(--muted); }
  td.low { background: var(--low-bg); color: var(--low-tx); font-weight: 600; }
  td.high { background: var(--high-bg); color: var(--high-tx); font-weight: 600; }
  .low1 { background: #fde8e7 !important; color: #a4161a !important; }
  .low2 { background: #f9c3bf !important; color: #8f1317 !important; }
  .low3 { background: #f08a83 !important; color: #5c0b0e !important; }
  .low4 { background: #d63a31 !important; color: #ffffff !important; }
  .high1 { background: #fff4d6 !important; color: #7a5200 !important; }
  .high2 { background: #ffe29a !important; color: #6b4700 !important; }
  .high3 { background: #ffc24d !important; color: #4d3300 !important; }
  .high4 { background: #f08c00 !important; color: #ffffff !important; }
  td.low1, td.low2, td.low3, td.low4, td.high1, td.high2, td.high3, td.high4 { font-weight: 600; }
  .scale { display: inline-flex; gap: 2px; margin-left: 4px; }
  .scale i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
  td.oos { color: var(--oos-tx); }
  td.none { color: var(--oos-tx); }
  td.cnt { font-weight: 600; }
  tr:hover td { filter: brightness(0.97); }
  th.logo { text-align: center; padding: 6px 12px; }
  .lg { position: relative; display: inline-block; height: 30px; vertical-align: middle; }
  .lg img { width: auto; max-width: 60px; height: 30px; border-radius: 7px; object-fit: contain; background: #fff;
            box-shadow: 0 0 0 1px var(--line); }
  .lg .bolt { position: absolute; right: -7px; bottom: -5px; width: 16px; height: 16px; border-radius: 50%;
              background: #ffd23f; color: #1f2328; font-size: 10px; line-height: 16px; text-align: center;
              box-shadow: 0 0 0 2px var(--head); }
  .tabs { display: flex; gap: 4px; padding: 0 20px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .tab { background: none; color: var(--muted); border-radius: 0; padding: 10px 14px; font-weight: 600;
         border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab.on { color: var(--text); border-bottom-color: var(--text); }
  .qconly { display: none !important; }
  body.qcview .qconly { display: inline-flex !important; }
  th.lft { text-align: left; }
  thead tr.r2 th { top: 43px; font-weight: 500; font-size: 12px; color: var(--muted); }
  th.gl, td.gl { border-left: 2px solid var(--line); }
  th[rowspan] { vertical-align: middle; }
  .seg { display: inline-flex; align-items: center; }
  .seg .sg { background: var(--bg); color: var(--muted); border: 1px solid var(--line); border-radius: 0; padding: 6px 12px; font-weight: 600; }
  .seg .sg:first-of-type { border-radius: 6px 0 0 6px; margin-left: 8px; }
  .seg .sg:last-of-type { border-radius: 0 6px 6px 0; border-left: 0; }
  .seg .sg.on { background: var(--btn); color: var(--btn-tx); border-color: var(--btn); }
  .rk { font-size: 11px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 0 6px; margin-left: 4px; }
  .rk.t50 { color: #1a7f37; border-color: #9fd5ae; }
  #cards { display: none; }
  @media (max-width: 700px) {
    header { padding: 12px 16px; gap: 8px 12px; }
    .brand .nh { height: 40px; } .brand svg { width: 44px; height: 34px; } h1 { font-size: 18px; }
    .meta { flex-basis: 100%; font-size: 12px; order: 3; }
    .right { margin-left: 0; width: 100%; justify-content: space-between; order: 4; }
    .legend { gap: 10px; font-size: 12px; flex-wrap: wrap; }
    .tabs { padding: 0 8px; overflow-x: auto; } .tab { padding: 10px; white-space: nowrap; }
    .filters { padding: 0 16px 12px; gap: 8px; }
    .filters label { width: 100%; justify-content: space-between; }
    .filters select, .filters input { min-width: 0; flex: 1; }
    .seg { width: 100%; } .seg .sg { flex: 1; }
    .wrap { display: none; }
    #cards { display: block; padding: 0 12px 24px; }
    .card { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: var(--bg); }
    .card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .card .sku { font-weight: 700; font-size: 15px; }
    .card .sub { color: var(--muted); font-size: 12px; margin: 2px 0 10px; }
    .card .bad { font-size: 12px; font-weight: 700; color: var(--low-tx); white-space: nowrap; }
    .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
    .chip { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 5px 7px; font-weight: 600; font-size: 13px; }
    .chip img { height: 20px; width: auto; max-width: 36px; border-radius: 4px; background: #fff; }
    .chip.low { background: var(--low-bg); color: var(--low-tx); border-color: transparent; }
    .chip.high { background: var(--high-bg); color: var(--high-tx); border-color: transparent; }
    .chip.oos { color: var(--oos-tx); }
    .app { display: flex; align-items: center; gap: 8px; margin: 8px 0 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
    .app img { height: 20px; width: auto; max-width: 36px; border-radius: 4px; background: #fff; }
  }
  th.sortable { cursor: pointer; }
  th.sortable:hover { background: var(--line); }
  th.sorted { box-shadow: inset 0 -3px 0 var(--text); }
  th .arrow { display: block; font-size: 9px; line-height: 10px; color: var(--text); }
  .blood, #culprits { display: none; }
  body.culview .blood { display: block; } body.culview #culprits { display: block; }
  body.culview .wrap, body.culview #cards { display: none !important; }
  body.culview .qconly2 { display: none !important; }
  .culprit-tab.on { color: #b3001b; border-bottom-color: #b3001b; }
  .blood { position: relative; margin: 0 20px 34px; height: 64px; border-radius: 10px 10px 4px 4px;
           background: linear-gradient(180deg, #5c0010 0%, #9b0019 60%, #b3001b 100%); overflow: visible; }
  .blood-title { position: absolute; inset: 0; display: flex; align-items: center; gap: 14px; padding: 0 22px;
                 color: #fff; font-weight: 900; letter-spacing: 3px; font-size: 24px; text-shadow: 0 2px 0 #3a000a; }
  .blood-title small { font-size: 12px; letter-spacing: 0; font-weight: 500; opacity: .85; text-shadow: none; }
  .drip { position: absolute; top: 100%; width: 9px; height: 0; background: #b3001b; border-radius: 0 0 8px 8px;
          animation: drip 3.2s ease-in infinite; }
  .drip::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 10px; height: 12px; margin-left: -5px;
                 background: #b3001b; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; opacity: 0; animation: drop 3.2s ease-in infinite;
                 animation-delay: inherit; }
  @keyframes drip { 0% { height: 0; } 55% { height: 22px; } 70% { height: 26px; } 100% { height: 0; } }
  @keyframes drop { 0%, 60% { opacity: 0; transform: translateY(0); } 65% { opacity: 1; } 100% { opacity: 0; transform: translateY(46px); } }
  @media (prefers-reduced-motion: reduce) { .drip, .drip::after { animation: none; height: 16px; } }
  #culprits { padding: 0 20px 30px; overflow-x: auto; }
  .ctab { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1100px; }
  .ctab th { position: static; background: var(--head); font-size: 12px; }
  .ctab th, .ctab td { padding: 8px 10px; vertical-align: middle; text-align: center; white-space: normal; }
  .ctab th:first-child, .ctab td:first-child { position: static; }
  .ctab .lft { text-align: left; }
  .ctab tr:hover td { background: var(--head); filter: none; }
  .ctab small { color: var(--muted); font-size: 11px; font-weight: 500; }
  .ctab .red { color: #b3001b; font-size: 15px; }
  .ctab .muted { color: var(--muted); font-size: 12px; }
  .mi { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 7px; padding: 3px 7px; margin: 2px 2px 2px 0; white-space: nowrap; }
  .mi img { height: 18px; width: auto; max-width: 38px; border-radius: 3px; background: #fff; }
  .culc { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
  .culc .mi { border-color: #f3b6b1; background: #fde8e7; }
  .culc .mi b { color: #b3001b; }
  .war { border: 1px solid var(--line); border-left: 5px solid #b3001b; border-radius: 10px; padding: 14px 16px; background: var(--bg); }
  .war .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .war .sku { font-weight: 800; font-size: 15px; }
  .war .sub { color: var(--muted); font-size: 12px; margin: 2px 0 10px; }
  .war .lbl { font-size: 11px; font-weight: 800; letter-spacing: 1px; color: var(--muted); margin: 10px 0 5px; text-transform: uppercase; }
  .war .lbl.red { color: #b3001b; }
  .who { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; font-size: 13px; }
  .who img { height: 26px; width: auto; max-width: 52px; border-radius: 5px; background: #fff; }
  .who b { font-size: 15px; }
  .who .t { margin-left: auto; color: var(--muted); font-size: 12px; text-align: right; }
  .who.cul { background: #fde8e7; border: 1px solid #f3b6b1; }
  .who.cul b { color: #b3001b; }
  .fol { display: flex; flex-wrap: wrap; gap: 6px; }
  .fol .who { border: 1px solid var(--line); padding: 5px 8px; flex: 1 1 180px; }
  .fol .who img { height: 20px; max-width: 40px; }
  .tag { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 8px; background: var(--head); color: var(--muted); }
  .tag.m { background: #fde8e7; color: #b3001b; }
  .empty { color: var(--muted); padding: 20px; }
  @media (max-width: 700px) { #culprits { padding: 0 12px 24px; } .blood { margin: 0 12px 34px; }
                              .blood-title { font-size: 18px; padding: 0 14px; } .blood-title small { display: none; } }
  .culonly { display: none !important; } body.culview .culonly { display: inline-flex !important; }
  .culonly input { min-width: 0 !important; flex: none !important; }
  .ctab td:nth-child(2) { white-space: nowrap; }
  #history { display: none; padding: 0 20px 30px; }
  body.hisview #history { display: block; } body.hisview .wrap, body.hisview #cards { display: none !important; }
  body.hisview .qconly2 { display: none !important; }
  .hisonly { display: none !important; } body.hisview .hisonly { display: inline-flex !important; }
  .hhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 4px 0 12px; }
  .hhead .sku { font-weight: 800; font-size: 17px; } .hhead .sub { color: var(--muted); font-size: 12px; }
  .hal { margin-left: auto; font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .hal .dash { width: 22px; border-top: 2px dashed var(--muted); display: inline-block; }
  .hrow { display: grid; grid-template-columns: 150px minmax(0, 1fr) 90px; align-items: center; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .hch { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
  .hch img { height: 24px; width: auto; max-width: 48px; border-radius: 4px; background: #fff; }
  .spark { display: block; overflow: visible; width: 100%; height: auto; }
  .spark .step { fill: none; stroke: var(--text); stroke-width: 2; vector-effect: non-scaling-stroke; }
  .spark .alline { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
  .spark .pt { fill: var(--text); stroke: var(--bg); stroke-width: 2; vector-effect: non-scaling-stroke; }
  .spark .pt.low { fill: #d63a31; } .spark .pt.high { fill: #f08c00; }
  .hnow { text-align: right; } .hnow b { display: block; font-size: 15px; } .hnow small { color: var(--muted); font-size: 11px; }
  .lowt { color: #b3001b; } .hight { color: #b25e00; }
  .haxis { display: flex; justify-content: space-between; margin: 4px 90px 0 162px; color: var(--muted); font-size: 11px; }
  .hlog { min-width: 640px; margin-top: 6px; } .hlog img { height: 18px; width: auto; max-width: 36px; vertical-align: middle; border-radius: 3px; background: #fff; }
  #history .lbl { font-size: 11px; font-weight: 800; letter-spacing: 1px; color: var(--muted); margin: 20px 0 6px; text-transform: uppercase; }
  @media (max-width: 700px) { #history { padding: 0 12px 24px; overflow-x: auto; } .hrow { grid-template-columns: 90px minmax(0, 1fr) 64px; gap: 8px; }
                              .hch span { display: none; } .haxis { margin: 4px 64px 0 98px; } }
  .chron { display: none; }
  body.hisview .chron { display: flex; align-items: stretch; margin: 0 20px 18px; height: 70px; }
  .chron .rod { width: 16px; border-radius: 8px; flex: none; z-index: 1;
                background: linear-gradient(90deg, #4a2c10, #9a6a35 45%, #5b3a16); box-shadow: 0 2px 4px rgba(0,0,0,.35); }
  .chron .paper { flex: 1; overflow: hidden; margin: 6px -4px; transform-origin: center;
                  background: radial-gradient(ellipse at 20% 30%, rgba(160,110,40,.18), transparent 55%),
                              radial-gradient(ellipse at 80% 70%, rgba(120,80,30,.16), transparent 50%), #f1e2bd;
                  box-shadow: inset 0 0 18px rgba(110,70,20,.45); border-top: 1px solid #c9a86a; border-bottom: 1px solid #c9a86a; }
  body.hisview.unroll .chron .paper { animation: unroll 1.4s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes unroll { from { transform: scaleX(0.02); } to { transform: scaleX(1); } }
  .ctitle { height: 100%; display: flex; align-items: center; justify-content: center; gap: 14px; white-space: nowrap;
            font-family: "Cinzel", Georgia, "Times New Roman", serif; color: #4a2c10; font-weight: 800; font-size: 22px; letter-spacing: 3px; }
  .ctitle small { font-family: Georgia, serif; font-size: 12px; letter-spacing: 0; font-weight: 400; font-style: italic; color: #6b4a22; }
  body.hisview.unroll .ctitle { animation: inkin 1.2s .9s both; }
  @keyframes inkin { from { opacity: 0; filter: blur(3px); } to { opacity: 1; filter: blur(0); } }
  .hourglass { width: 20px; height: 28px; animation: flip 4s ease-in-out infinite; }
  .hourglass .sand-top { animation: drain 4s linear infinite; transform-origin: 12px 15px; }
  .hourglass .sand-bot { animation: fill 4s linear infinite; transform-origin: 12px 29px; }
  .hourglass .sand-fall { animation: fall 4s linear infinite; }
  @keyframes drain { 0% { transform: scaleY(1); } 80%, 100% { transform: scaleY(0); } }
  @keyframes fill { 0% { transform: scaleY(0); } 80%, 100% { transform: scaleY(1); } }
  @keyframes fall { 0%, 78% { opacity: 1; } 80%, 100% { opacity: 0; } }
  @keyframes flip { 0%, 85% { transform: rotate(0); } 100% { transform: rotate(180deg); } }
  body.hisview #history { background: radial-gradient(ellipse at 10% 0%, rgba(160,110,40,.10), transparent 40%), #faf3e1;
                          border: 1px solid #e3cf9f; border-radius: 6px; margin: 0 20px 30px; padding: 16px 20px 24px;
                          font-family: Georgia, "Times New Roman", serif; color: #3b2a14; }
  body.hisview.unroll #history { animation: inkin 1s .6s both; }
  body.hisview #history .hhead .sku { font-family: "Cinzel", Georgia, serif; letter-spacing: 1px; }
  body.hisview #history .spark .step { stroke: #4a2c10; }
  body.hisview #history .hrow { border-bottom-color: #e6d4a8; }
  body.hisview #history .ctab th { background: #efdfb6; color: #4a2c10; font-family: "Cinzel", Georgia, serif; }
  body.hisview #history .ctab td { border-bottom-color: #ead9ae; }
  body.hisview #history .lbl { font-family: "Cinzel", Georgia, serif; color: #6b4a22; }
  @media (prefers-color-scheme: dark) {
    body.hisview #history { background: #2a2216; border-color: #5a4626; color: #efdfb6; }
    body.hisview #history .ctab th { background: #3a2f1d; color: #efdfb6; }
    body.hisview #history .spark .step { stroke: #efdfb6; }
    body.hisview #history .hrow, body.hisview #history .ctab td { border-bottom-color: #4a3b22; }
  }
  @media (prefers-reduced-motion: reduce) { .chron .paper, .ctitle, #history, .hourglass, .hourglass * { animation: none !important; } }
  @media (max-width: 700px) { body.hisview .chron { margin: 0 12px 14px; height: 56px; } .ctitle { font-size: 15px; gap: 8px; letter-spacing: 1px; }
                              .ctitle small { display: none; } body.hisview #history { margin: 0 8px 24px; padding: 12px 10px; } }
  /* ---------- live viewers + "war has started" banner (shown when more than 3 people have the dashboard open) */
  .watch { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); border: 1px solid var(--line);
           border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
  .watch .live { width: 8px; height: 8px; border-radius: 50%; background: #22a06b; animation: livepulse 1.6s infinite; }
  .watch.hot { color: #b3001b; border-color: #f3b6b1; background: #fde8e7; font-weight: 700; } .watch.hot .live { background: #e0182d; }
  @keyframes livepulse { 0% { box-shadow: 0 0 0 0 rgba(34,160,107,.6); } 100% { box-shadow: 0 0 0 8px rgba(34,160,107,0); } }
  .warban { position: relative; overflow: hidden; margin: 0 20px 10px; border-radius: 12px; color: #fff; height: 92px;
            background: linear-gradient(100deg, #5c0010, #b3001b 35%, #e8590c 70%, #5c0010); background-size: 220% 100%;
            animation: warbg 3s linear infinite, warshake .6s 1; display: flex; align-items: center; justify-content: center; gap: 18px; }
  .warban[hidden] { display: none; }
  @keyframes warbg { from { background-position: 0 0; } to { background-position: 220% 0; } }
  @keyframes warshake { 0%,100% { transform: none; } 15% { transform: translate(-8px,2px) rotate(-.6deg); } 30% { transform: translate(7px,-2px) rotate(.6deg); }
                        45% { transform: translate(-5px,1px); } 60% { transform: translate(4px,-1px); } 75% { transform: translate(-2px,0); } }
  .warban .wsw { width: 120px; height: 84px; flex: none; }
  .warban .wsw .l { transform-origin: 20px 78px; animation: swl 1.2s ease-in-out infinite; }
  .warban .wsw .r { transform-origin: 100px 78px; animation: swr 1.2s ease-in-out infinite; }
  @keyframes swl { 0%,100% { transform: rotate(-28deg); } 45% { transform: rotate(14deg); } 55% { transform: rotate(10deg); } }
  @keyframes swr { 0%,100% { transform: rotate(28deg); } 45% { transform: rotate(-14deg); } 55% { transform: rotate(-10deg); } }
  .warban .spark { transform-origin: 60px 30px; animation: spark 1.2s ease-out infinite; opacity: 0; }
  @keyframes spark { 0%,40% { opacity: 0; transform: scale(.2); } 46% { opacity: 1; transform: scale(1.3); } 70%,100% { opacity: 0; transform: scale(.6); } }
  .warban .wtxt { text-align: center; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
  .warban .wtxt b { display: block; font-size: 28px; font-weight: 900; letter-spacing: 4px; animation: wpop 1.2s ease-in-out infinite; }
  .warban .wtxt span { font-size: 13px; opacity: .95; }
  @keyframes wpop { 0%,40%,100% { transform: scale(1); } 46% { transform: scale(1.08); } }
  .warban .wx { position: absolute; top: 6px; right: 10px; background: none; border: 0; color: #fff; font-size: 20px; cursor: pointer; opacity: .8; }
  .ember { position: absolute; bottom: -6px; width: 5px; height: 5px; border-radius: 50%; background: #ffd23f; box-shadow: 0 0 6px #ffb347; animation: ember 2.6s linear infinite; }
  @keyframes ember { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-100px) translateX(14px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .warban, .warban * { animation: none !important; } .warban .spark { opacity: 1; } }
  @media (max-width: 700px) { .warban { margin: 0 8px 8px; height: 78px; gap: 6px; } .warban .wsw { width: 70px; height: 50px; }
                              .warban .wtxt b { font-size: 18px; letter-spacing: 2px; } .warban .wtxt span { font-size: 11px; } }

  a.go:hover { text-decoration: underline; text-underline-offset: 3px; }

// ---------------- Culprit: who went below the Event/BAU price first, who followed
const when = t => { const m = String(t).match(/^(\d{4})-(\d\d)-(\d\d) (\d\d:\d\d)/);
  return m ? (+m[3]) + " " + ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m[2] - 1] + " " + m[4] : t; };
const FIRST = (() => { let f = ""; (DATA && DATA.rows || []).forEach(r => Object.values(r.hist || {}).forEach(p =>
  { if (p.length && (!f || p[0][0] < f)) f = p[0][0]; })); return f; })();
// Culprit rule (Harsh): the culprit is NOT simply the cheapest channel. It is the channel that
// started the price the MAJORITY of channels ended up matching. A channel that is cheaper on its
// own (nobody matches it - e.g. FirstCry often) is shown as "alone below", not as the culprit.
function sinceAtOrBelow(pts, level) {               // start of the current streak at <= level
  if (!pts.length) return {t: DATA.updated, start: true};
  let i = pts.length - 1;
  while (i > 0 && pts[i - 1][1] <= level + TOL) i--;
  return {t: pts[i][0], start: i === 0 && pts[0][0] <= FIRST, city: pts[pts.length - 1][2] || ""};
}
function war(r) {
  const al = AL(r); if (al == null) return null;
  const below = [], hold = [];
  Object.keys(r.cells).forEach(ch => {
    const c = r.cells[ch]; if (!c || c[2]) return;        // not listed / out of stock now
    (c[0] < al - TOL ? below : hold).push({ch, p: c[0]});
  });
  if (!below.length) return null;
  // group channels selling at (almost) the same price: within Rs 1 or 1%
  below.sort((a, b) => a.p - b.p);
  const groups = [];
  below.forEach(x => {
    const g = groups[groups.length - 1];
    if (g && x.p - g[g.length - 1].p <= Math.max(TOL, g[0].p * 0.01)) g.push(x); else groups.push([x]);
  });
  // the war price = the price level matched by the most channels (tie -> the lower one)
  let best = groups[0];
  groups.forEach(g => { if (g.length > best.length) best = g; });
  if (best.length < 2) {
    return {al, cul: null, fol: [], alone: below, hold, warP: null, gap: (al - below[0].p) / al};
  }
  const level = best[best.length - 1].p;
  best.forEach(x => Object.assign(x, sinceAtOrBelow(((r.hist || {})[x.ch]) || [], level)));
  best.sort((a, b) => a.t.localeCompare(b.t) || a.p - b.p || ((r.cr || {})[a.ch] || 1e9) - ((r.cr || {})[b.ch] || 1e9));
  const alone = below.filter(x => !best.includes(x));
  return {al, cul: best[0], fol: best.slice(1), alone, hold, warP: best[0].p, gap: (al - level) / al};
}
function pct(p, al) { return Math.round((p - al) / al * 100) + "%"; }

// ---- Download: a clean Excel file (numbers stay numbers, one value per cell)
//   Sheet "Summary"  one row per NH SKU, one price column per channel (lowest price)
//   Sheet "Details"  one row per NH SKU x channel x city - easy to filter / pivot
function dlTables() {
  const lab = MODE === "bau" ? "BAU" : "Event", rows = shown(), qcSet = new Set(DATA.qcApps || []);
  const num = v => v == null || v === "" ? null : Math.round(v);
  const pc = (p, al) => p == null || !al ? null : Math.round((p - al) / al * 1000) / 1000;
  const sumHead = ["NH SKU", "Revenue rank", "Category", "Product", lab + " price"]
    .concat(DATA.channels, ["Lowest price", "Lowest on", "Channels below", "Channels above", "Channels at par", "Out of stock"]);
  const sum = [sumHead];
  const detHead = ["NH SKU", "Revenue rank", "Category", "Product", "Channel", "Type", "City", "Pincode",
                   "Price", lab + " price", "Difference (Rs)", "Difference %", "Status"];
  const det = [detHead];
  const cols = VIEW === "qc" ? qcCols() : null;
  rows.forEach(r => {
    const al = num(AL(r)), line = [r.sku, r.rank == null ? null : r.rank, r.cat || "", r.name || "", al];
    let low = null, lowOn = [], nb = 0, na = 0, np = 0, no = 0;
    DATA.channels.forEach(ch => {
      const c = r.cells[ch];
      if (!c) { line.push(null); return; }
      if (c[2]) { line.push(null); no++; return; }
      const p = num(c[0]); line.push(p);
      if (low == null || p < low) { low = p; lowOn = [ch]; } else if (p === low) lowOn.push(ch);
      const st = cellState(r, c); if (st === "low") nb++; else if (st === "high") na++; else if (st === "ok") np++;
    });
    sum.push(line.concat([low, lowOn.join(", "), nb, na, np, no]));
    const add = (ch, city, pin, price, oos) => {
      const p = num(price), st = stateOf(price, price, oos, AL(r));
      det.push([r.sku, r.rank == null ? null : r.rank, r.cat || "", r.name || "", ch, qcSet.has(ch) ? "QC" : "Marketplace",
                city, pin, oos ? null : p, al, oos || al == null || p == null ? null : p - al, oos ? null : pc(p, al), STATE[st]]);
    };
    DATA.channels.forEach(ch => {
      if (qcSet.has(ch)) {
        (DATA.pins || []).forEach(pn => {
          if (cols && !cols.some(x => x.ch === ch && x.pin === pn.pin)) return;
          const v = (r.qc[ch] || {})[pn.pin]; if (v) add(ch, pn.city || "", pn.pin, v[0], v[1]);
        });
      } else if (!cols) {
        const c = r.cells[ch]; if (c) add(ch, "All India", "", c[0], c[2]);
      }
    });
  });
  return {sum, det, lab};
}
function loadXLSX() {

    sc.onload = () => ok(window.XLSX); sc.onerror = bad; document.head.appendChild(sc);
  });
}

      const ws = X.utils.aoa_to_sheet(aoa);
      ws["!cols"] = widths.map(w => ({wch: w}));
      ws["!autofilter"] = {ref: X.utils.encode_range({s: {r: 0, c: 0}, e: {r: aoa.length - 1, c: aoa[0].length - 1}})};
      for (let i = 1; i < aoa.length; i++) {
        money.forEach(c => { const a = ws[X.utils.encode_cell({r: i, c})]; if (a && a.t === "n") a.z = '"₹"#,##0;-"₹"#,##0'; });
        pcts.forEach(c => { const a = ws[X.utils.encode_cell({r: i, c})]; if (a && a.t === "n") a.z = "0%"; });
      }
      return ws;
    };
    const n = DATA.channels.length, money = [4].concat(DATA.channels.map((_, i) => 5 + i), [5 + n]);
    X.utils.book_append_sheet(wb, sheet(sum, [16, 8, 16, 38, 11].concat(DATA.channels.map(() => 11), [12, 20, 10, 10, 10, 10]), money, []), "Summary");
    X.utils.book_append_sheet(wb, sheet(det, [16, 8, 16, 38, 12, 12, 12, 9, 9, 11, 14, 12, 16], [8, 9, 10], [11]), "Details");
    const how = [["How to read this file"], [""],
      ["Summary", "One row per NH SKU. Each channel column = lowest selling price now (blank = not listed or out of stock)."],
      ["Details", "One row per NH SKU x channel x city. Use filters / pivot on it."],
      ["Difference (Rs)", "Price minus " + lab + " price. Negative = cheaper than " + lab + "."],
      ["Difference %", "Difference as a % of the " + lab + " price."],
      ["Status", "Below / Above / At par (within Rs " + TOL + ") / Out of stock"],
      ["Data as of", DATA.updated || ""]];
    const hw = X.utils.aoa_to_sheet(how); hw["!cols"] = [{wch: 16}, {wch: 100}];
    X.utils.book_append_sheet(wb, hw, "How to read");
    X.writeFile(wb, name + ".xlsx");
  }).catch(() => {                                  // no internet: plain CSV of the Details sheet
    const q = v => v == null ? "" : (typeof v === "number" ? String(v) : '"' + String(v).replace(/"/g, '""') + '"');
    const blob = new Blob(["﻿" + det.map(r => r.map(q).join(",")).join("\r\n")], {type: "text/csv;charset=utf-8"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
  });
}

// ---------------- Live viewers. Every open dashboard sends a small "I am watching" ping (a random id,
// nothing else) through a free public message server. When MORE THAN 3 people have it open at the
// same time, the "PRICE WAR HAS STARTED" banner plays for everyone.
(function () {
  const WAR_AT = 4;                                   // more than 3 people
  const TOPIC = "nathabit/pricewar-7f3k2q/watching";
  const BROKER = new URLSearchParams(location.search).get("broker") || "wss://broker.hivemq.com:8884/mqtt";
  const LIB = "https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js";
  const me = Math.random().toString(36).slice(2, 10), seen = {}, ttl = 40000;
  let hidden = false, last = 0;
  function show() {
    const now = Date.now();
    Object.keys(seen).forEach(k => { if (now - seen[k] > ttl) delete seen[k]; });
    seen[me] = now;
    const n = Object.keys(seen).length, w = $("watch");
    w.hidden = false; $("wn").textContent = n; w.classList.toggle("hot", n >= WAR_AT);
    const war = n >= WAR_AT;
    if (war && n > last) hidden = false;               // someone new joined -> show again
    $("wmsg").textContent = n + " people are watching the prices right now";
    $("warban").hidden = !war || hidden;
    last = n;
  }
  $("wx").onclick = () => { hidden = true; show(); };
  function start() {
    let c;
    try {
      c = mqtt.connect(BROKER, {clientId: "pw_" + me, clean: true, reconnectPeriod: 5000, connectTimeout: 10000,
                                will: {topic: TOPIC, payload: JSON.stringify({id: me, bye: 1}), qos: 0, retain: false}});
    } catch (e) { return; }
    const ping = () => c.connected && c.publish(TOPIC, JSON.stringify({id: me}));
    c.on("connect", () => { c.subscribe(TOPIC, () => ping()); });
    c.on("message", (t, m) => {
      try { const d = JSON.parse(m.toString()); if (!d.id || d.id === me) return;
            if (d.bye) delete seen[d.id]; else { const isNew = !seen[d.id]; seen[d.id] = Date.now(); if (isNew) ping(); }
            show(); } catch (e) {}
    });
    setInterval(() => { ping(); show(); }, 15000);
    addEventListener("pagehide", () => { try { c.publish(TOPIC, JSON.stringify({id: me, bye: 1})); c.end(true); } catch (e) {} });
    show();
  }
  const sc = document.createElement("script"); sc.src = LIB; sc.onload = start; sc.onerror = () => {};
  document.head.appendChild(sc);
})();

// ---------------- Auto refresh: on the live (GitHub) link, check every 2 minutes for a newer run
// and reload by itself - the open tab and Event/BAU choice are kept.
(function () {
  try {                                                // restore view after an auto reload
    const k = JSON.parse(sessionStorage.getItem("pw_keep") || "null"); sessionStorage.removeItem("pw_keep");
    if (k) {
      if (k.m) { const b = document.querySelector('.sg[data-m="' + k.m + '"]'); if (b) b.click(); }
      if (k.v) { const t = document.querySelector('.tab[data-v="' + k.v + '"]'); if (t) t.click(); }
      if (k.y) setTimeout(() => scrollTo(0, k.y), 300);
    }
  } catch (e) {}
  if (!/^https?:/.test(location.protocol) || !DATA) return;
  setInterval(() => {
    fetch(location.pathname + "?v=" + Date.now(), {cache: "no-store"}).then(r => r.ok ? r.text() : "").then(t => {
      const m = t.match(/"updated":\s*"([^"]*)"/);
      if (m && m[1] && m[1] !== DATA.updated) {
        try { sessionStorage.setItem("pw_keep", JSON.stringify({v: VIEW, m: MODE, y: scrollY})); } catch (e) {}
        location.reload();
      }
    }).catch(() => {});
  }, 120000);
})();
