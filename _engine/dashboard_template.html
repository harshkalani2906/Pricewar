<title>Price War</title>

<style>

  body.hisview .qconly2 { display: none !important; }
  .hisonly { display: none !important; } body.hisview .hisonly { display: inline-flex !important; }
  .hhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 4px 0 12px; }

    <span>THE PRICE CHRONICLES</span><small>every price change &middot; last 7 days</small></div></div>
  <span class="rod"></span>
</div>
<div id="history"></div>
<div class="wrap"><table id="t"></table></div>
<div id="cards"></div>
<script>
const DATA = /*__DATA__*/null;
let VIEW = "all", MODE = "event", SORTCH = "";
const TOL = (DATA && DATA.tol != null) ? DATA.tol : 1;
const $ = id => document.getElementById(id);
const R0 = v => v == null || v === "" ? "" : Math.round(v);
const rs = v => v == null ? "" : "\u20B9" + Math.round(v);
const AL = r => MODE === "bau" ? r.alb : r.ale;
function stateOf(lo, hi, oos, al) {
  if (oos) return "oos";
  if (al == null) return "na";
  if (lo < al - TOL) return "low";
  if (hi > al + TOL) return "high";
  return "ok";
}
const cellState = (r, c) => stateOf(c[0], c[1], c[2], AL(r));
const qcState = (r, v) => stateOf(v[0], v[0], v[1], AL(r));
const cellText = c => !c ? "\u2013" : (c[2] ? "OOS" : (R0(c[0]) === R0(c[1]) ? rs(c[0]) : rs(c[0]) + "\u2013" + R0(c[1])));
const OFF = s => s === "low" || s === "high";
const STATE = {low: "Below", high: "Above", oos: "Out of stock", ok: "At par", na: "No Event/BAU price"};
// how far from the Event/BAU price, as a share of it -> colour step 1..4
function grade(lo, hi, oos, al) {
  const st = stateOf(lo, hi, oos, al);
  if (st !== "low" && st !== "high") return st === "oos" ? "oos" : "";
  const gap = st === "low" ? (al - lo) / al : (hi - al) / al;
  const step = gap < 0.05 ? 1 : gap < 0.10 ? 2 : gap < 0.20 ? 3 : 4;
  return st + " " + st + step;
}
const gapTxt = (p, al) => al ? " (" + (p >= al ? "+" : "") + Math.round((p - al) / al * 100) + "% vs " + (MODE === "bau" ? "BAU" : "Event") + ")" : "";
function esc(s) { return String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }
function rkb(r) { return r.rank == null ? "" : ' <span class="rk' + (r.tier === "Top 50" ? " t50" : "") + '" title="October revenue rank">#' + r.rank + "</span>"; }
function cls(st) { return st === "low" || st === "high" || st === "oos" ? st : ""; }
function logoTh(c, extra) {
  const L = DATA.logos || {};
  const on = SORTCH === c ? " sorted" : "";
  const tip = ' title="' + esc(c) + ' \u2013 click to sort by ' + esc(c) + ' sales and mismatches (click again to undo)"';
  const inner = L[c] ? '<span class="lg"><img src="' + L[c] + '" alt="' + esc(c) + '"></span>' : esc(c);
  return '<th class="logo sortable' + on + '" data-ch="' + esc(c) + '"' + extra + tip + ">" + inner +
         (on ? '<span class="arrow">\u25BC</span>' : "") + "</th>";
}

// ---- columns of the current view: [{ch, pin, label}]
function qcCols() {
  const app = $("fapp").value, city = $("fcity").value, out = [];
  (DATA.qcApps || []).filter(a => !app || a === app).forEach(a =>
    (DATA.pins || []).filter(p => !city || p.pin === city).forEach(p => out.push({ch: a, pin: p.pin, label: p.city || p.pin})));
  return out;
}
function qcBad(r, cols) { return cols.filter(c => { const v = (r.qc[c.ch] || {})[c.pin]; return v && OFF(qcState(r, v)); }).length; }
function allBad(r) { return DATA.channels.filter(ch => r.cells[ch] && OFF(cellState(r, r.cells[ch]))).length; }

function shown() {
  const c = $("fcat").value, k = $("fsku").value.trim().toUpperCase(), pr = $("fpri").value;
  const hasTier = DATA.rows.some(r => r.tier);
  const inPri = r => !hasTier || pr === "all" || (pr === "50" ? r.tier === "Top 50" : (r.tier === "Top 50" || r.tier === "80% revenue"));
  let rows = DATA.rows.filter(r => inPri(r) && (!c || r.cat === c) && (!k || r.sku.toUpperCase().includes(k)));
  if (VIEW === "qc") {
    const cols = qcCols();
    rows = rows.filter(r => cols.some(x => (r.qc[x.ch] || {})[x.pin])).map(r => Object.assign({}, r, {bad: qcBad(r, cols)}));
  } else {
    rows = rows.map(r => Object.assign({}, r, {bad: allBad(r)}));
  }
  const rk = r => r.rank == null ? 99999 : r.rank;
  if (SORTCH) {
    // clicked channel: SKUs off the aligned price THERE first, then by that channel's own sales rank
    const ch = SORTCH, cols = VIEW === "qc" ? qcCols().filter(c => c.ch === ch) : [];
    const off = r => VIEW === "qc" ? cols.filter(c => { const v = (r.qc[ch] || {})[c.pin]; return v && OFF(qcState(r, v)); }).length
                                   : (r.cells[ch] && OFF(cellState(r, r.cells[ch])) ? 1 : 0);
    const has = r => VIEW === "qc" ? (cols.some(c => (r.qc[ch] || {})[c.pin]) ? 1 : 0) : (r.cells[ch] ? 1 : 0);
    const cr = r => (r.cr || {})[ch] || 99999;
    return rows.sort((a, b) => off(b) - off(a) || has(b) - has(a) || cr(a) - cr(b) || b.bad - a.bad || rk(a) - rk(b));
  }
  return rows.sort((a, b) => b.bad - a.bad || (AL(a) == null) - (AL(b) == null) || rk(a) - rk(b) || a.sku.localeCompare(b.sku));
}

function setupFilters() {
  if (!DATA || !DATA.rows.length) return;
  const cats = [...new Set(DATA.rows.map(r => r.cat).filter(Boolean))].sort();
  $("fcat").innerHTML += cats.map(c => "<option>" + esc(c) + "</option>").join("");
  $("skulist").innerHTML = DATA.rows.map(r => '<option value="' + esc(r.sku) + '">').join("");
  $("fapp").innerHTML += (DATA.qcApps || []).map(a => "<option>" + esc(a) + "</option>").join("");
  $("fcity").innerHTML += (DATA.pins || []).map(p => '<option value="' + p.pin + '">' + esc((p.city || "") + " " + p.pin) + "</option>").join("");
  ["fcat", "fapp", "fcity", "fpri"].forEach(id => $(id).onchange = render);
  $("fsort").innerHTML += DATA.channels.map(c => '<option value="' + esc(c) + '">' + esc(c) + " \u2013 sales & mismatch</option>").join("");
  $("fwar").onchange = render;
  $("fhist").onchange = () => { $("fsku").value = ""; render(); };
  $("fsort").onchange = () => { SORTCH = $("fsort").value; render(); };
  $("t").addEventListener("click", e => {
    const th = e.target.closest("th[data-ch]");
    if (!th) return;
    SORTCH = SORTCH === th.dataset.ch ? "" : th.dataset.ch;
    $("fsort").value = SORTCH;
    render();
  });
  $("fsku").oninput = render;
  $("fclear").onclick = () => { ["fcat", "fsku", "fapp", "fcity", "fsort"].forEach(id => $(id).value = ""); SORTCH = ""; $("fpri").value = "80"; render(); };
  document.querySelectorAll(".sg").forEach(b => b.onclick = () => {
    MODE = b.dataset.m;
    document.querySelectorAll(".sg").forEach(x => x.classList.toggle("on", x === b));
    render();
  });
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
    VIEW = b.dataset.v;
    document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b));
    document.body.classList.toggle("qcview", VIEW === "qc");
    document.body.classList.toggle("culview", VIEW === "cul");
    document.body.classList.toggle("hisview", VIEW === "his");
    document.body.classList.remove("unroll");
    if (VIEW === "his") { void document.body.offsetWidth; document.body.classList.add("unroll"); }
    render();
  });
}

const MOBILE = () => window.matchMedia("(max-width: 700px)").matches;
function logoImg(c) { const L = DATA.logos || {}; return L[c] ? '<img src="' + L[c] + '" alt="' + esc(c) + '" title="' + esc(c) + '">' : esc(c); }
function renderCards(rows) {
  let h = "";
  const shown = rows.slice(0, 300);
  shown.forEach(r => {
    h += '<div class="card"><div class="top"><span class="sku">' + esc(r.sku) + rkb(r) + "</span>" +
         (r.bad ? '<span class="bad">' + r.bad + (r.bad > 1 ? " mismatches" : " mismatch") + "</span>" : "") + "</div>" +
         '<div class="sub">' + esc(r.cat || "") + (r.cat ? " \u00B7 " : "") + (MODE === "bau" ? "BAU " : "Event ") + (AL(r) == null ? "\u2013" : rs(AL(r))) + "</div>";
    if (VIEW === "all") {
      h += '<div class="chips">';
      DATA.channels.forEach(ch => { const c = r.cells[ch]; if (!c) return;
        h += '<span class="chip ' + grade(c[0], c[1], c[2], AL(r)) + '" title="' + esc(c[3]) + '">' + logoImg(ch) + cellText(c) + "</span>"; });
      h += "</div>";
    } else {
      const cols = qcCols();
      [...new Set(cols.map(c => c.ch))].forEach(a => {
        const cs = cols.filter(c => c.ch === a && (r.qc[a] || {})[c.pin]);
        if (!cs.length) return;
        h += '<div class="app">' + logoImg(a) + esc(a) + '</div><div class="chips">';
        cs.forEach(c => { const v = r.qc[a][c.pin];
          h += '<span class="chip ' + grade(v[0], v[0], v[1], AL(r)) + '">' + esc(c.label) + " " + (v[1] ? "OOS" : rs(v[0])) + "</span>"; });
        h += "</div>";
      });
    }
    h += "</div>";
  });
  if (rows.length > shown.length) h += '<p class="sub">Showing first 300 - use the filters to narrow down.</p>';
  $("cards").innerHTML = h || '<p class="sub">No SKUs match the filters.</p>';
}

// ---------------- Culprit: who went below the Event/BAU price first, who followed
const when = t => { const m = String(t).match(/^(\d{4})-(\d\d)-(\d\d) (\d\d:\d\d)/);
  return m ? (+m[3]) + " " + ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m[2] - 1] + " " + m[4] : t; };
const FIRST = (() => { let f = ""; (DATA && DATA.rows || []).forEach(r => Object.values(r.hist || {}).forEach(p =>
  { if (p.length && (!f || p[0][0] < f)) f = p[0][0]; })); return f; })();
// Culprit rule (Harsh): the culprit is NOT simply the cheapest channel. It is the channel that
// started the price the MAJORITY of channels ended up matching. A channel that is cheaper on its
// own (nobody matches it - e.g. FirstCry often) is shown as "alone below", not as the culprit.
function sinceAtOrBelow(pts, level) {               // start of the current streak at <= level
  if (!pts.length) return {t: DATA.updated, start: true};
  let i = pts.length - 1;
  while (i > 0 && pts[i - 1][1] <= level + TOL) i--;
  return {t: pts[i][0], start: i === 0 && pts[0][0] <= FIRST, city: pts[pts.length - 1][2] || ""};
}
function war(r) {
  const al = AL(r); if (al == null) return null;
  const below = [], hold = [];
  Object.keys(r.cells).forEach(ch => {
    const c = r.cells[ch]; if (!c || c[2]) return;        // not listed / out of stock now
    (c[0] < al - TOL ? below : hold).push({ch, p: c[0]});
  });
  if (!below.length) return null;
  // group channels selling at (almost) the same price: within Rs 1 or 1%
  below.sort((a, b) => a.p - b.p);
  const groups = [];
  below.forEach(x => {
    const g = groups[groups.length - 1];
    if (g && x.p - g[g.length - 1].p <= Math.max(TOL, g[0].p * 0.01)) g.push(x); else groups.push([x]);
  });
  // the war price = the price level matched by the most channels (tie -> the lower one)
  let best = groups[0];
  groups.forEach(g => { if (g.length > best.length) best = g; });
  if (best.length < 2) {
    return {al, cul: null, fol: [], alone: below, hold, warP: null, gap: (al - below[0].p) / al};
  }
  const level = best[best.length - 1].p;
  best.forEach(x => Object.assign(x, sinceAtOrBelow(((r.hist || {})[x.ch]) || [], level)));
  best.sort((a, b) => a.t.localeCompare(b.t) || a.p - b.p || ((r.cr || {})[a.ch] || 1e9) - ((r.cr || {})[b.ch] || 1e9));
  const alone = below.filter(x => !best.includes(x));
  return {al, cul: best[0], fol: best.slice(1), alone, hold, warP: best[0].p, gap: (al - level) / al};
}
function pct(p, al) { return Math.round((p - al) / al * 100) + "%"; }
function mini(x, extra) { return '<span class="mi">' + logoImg(x.ch) + "<b>" + rs(x.p) + "</b>" + (extra || "") + "</span>"; }
function renderCulprits(rows) {
  const W = rows.map(r => ({r, w: war(r)})).filter(x => x.w && (!$("fwar").checked || x.w.cul));
  // sales salience: biggest October revenue SKUs first
  W.sort((a, b) => (a.r.rank || 1e9) - (b.r.rank || 1e9) || a.r.sku.localeCompare(b.r.sku));
  const wars = W.filter(x => x.w.cul).length;
  $("count").textContent = wars + " SKUs in a price war · " + (W.length - wars) + " with a channel alone below";
  const lab = MODE === "bau" ? "BAU" : "Event";
  let h = '<table class="ctab"><thead><tr><th>#</th><th class="lft">NH SKU</th><th class="lft">Category</th><th>' + lab +
          '</th><th>War price</th><th class="lft">🩸 Culprit (started it)</th><th class="lft">Followed, in order</th>' +
          '<th class="lft">Alone below (nobody matched)</th><th class="lft">Holding ' + lab + "</th></tr></thead><tbody>";
  W.forEach(({r, w}) => {
    const c = w.cul;
    h += "<tr><td class=\"cnt\">" + (r.rank || "") + '</td><td class="lft"><b>' + esc(r.sku) + "</b></td>" +
         '<td class="cat">' + esc(r.cat || "") + "</td><td>" + rs(w.al) + "</td>" +
         "<td>" + (c ? '<b class="red">' + rs(w.warP) + "</b><br><small>" + pct(w.warP, w.al) + "</small>" : "–") + "</td>" +
         '<td class="lft">' + (c ? '<div class="culc">' + mini(c, c.city ? " <small>" + esc(c.city) + "</small>" : "") +
           "<small>" + (c.start ? "already at this price when tracking started (" + when(c.t) + ")" : "since " + when(c.t)) +
           "</small></div>" : '<span class="muted">no price war</span>') + "</td>" +
         '<td class="lft">' + (w.fol.length ? w.fol.map((x, i) => mini(x, " <small>" + (x.start ? "from start" : when(x.t)) + "</small>")).join(" ") : "–") + "</td>" +
         '<td class="lft">' + (w.alone.length ? w.alone.map(x => mini(x, " <small>" + pct(x.p, w.al) + "</small>")).join(" ") : "–") + "</td>" +
         '<td class="lft">' + (w.hold.length ? w.hold.map(x => mini(x)).join(" ") : "–") + "</td></tr>";
  });
  $("culprits").innerHTML = W.length ? h + "</tbody></table>"
    : '<div class="empty">No SKU is below the ' + lab + " price on any channel right now.</div>";
}

// ---------------- Price history: every price change of one SKU on every channel (last 7 days)
const tms = t => { const m = String(t).match(/^(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d)/); return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5]).getTime() : 0; };
function renderHistory(rows) {
  const list = rows.filter(r => Object.keys(r.hist || {}).length).sort((a, b) => (a.rank || 1e9) - (b.rank || 1e9) || a.sku.localeCompare(b.sku));
  const sel = $("fhist"), keep = sel.value;
  sel.innerHTML = list.map(r => '<option value="' + esc(r.sku) + '">' + (r.rank ? "#" + r.rank + "  " : "") + esc(r.sku) + "</option>").join("");
  const typed = $("fsku").value.trim().toUpperCase();
  const pick = list.find(r => r.sku.toUpperCase() === typed) || list.find(r => r.sku === keep) || list[0];
  $("count").textContent = list.length + " SKUs with history · last 7 days";
  if (!pick) { $("history").innerHTML = '<div class="empty">No price history yet.</div>'; return; }
  sel.value = pick.sku;
  const r = pick, al = AL(r), lab = MODE === "bau" ? "BAU" : "Event";
  const chans = DATA.channels.filter(c => (r.hist[c] || []).length);
  const all = chans.flatMap(c => r.hist[c]);
  const t0 = Math.min(...all.map(p => tms(p[0]))), t1 = Math.max(tms(DATA.updated), ...all.map(p => tms(p[0])));
  const span = Math.max(t1 - t0, 3600e3);
  const ps = all.map(p => p[1]).concat(al != null ? [al] : []);
  let lo = Math.min(...ps), hi = Math.max(...ps); const pad = Math.max((hi - lo) * 0.15, hi * 0.03); lo -= pad; hi += pad;
  const box = $("history").clientWidth || 900, W = Math.max(160, box - (MOBILE() ? 190 : 300)), H = 64, X = t => 6 + (tms(t) - t0) / span * (W - 12), Y = p => 6 + (hi - p) / (hi - lo) * (H - 12);
  let h = '<div class="hhead"><span class="sku">' + esc(r.sku) + rkb(r) + "</span> <span class=\"sub\">" + esc(r.cat || "") +
          (r.cat ? " · " : "") + esc(r.name || "") + "</span><span class=\"hal\">" + lab + " " + (al == null ? "–" : rs(al)) +
          '<i class="dash"></i></span></div><div class="hgrid">';
  chans.forEach(ch => {
    const pts = r.hist[ch];
    let d = "", prevY = null;
    pts.forEach((p, i) => { const x = X(p[0]), y = Y(p[1]); d += (i ? "H" + x.toFixed(1) + "V" + y.toFixed(1) : "M" + x.toFixed(1) + " " + y.toFixed(1)); prevY = y; });
    d += "H" + (W - 6);
    const dots = pts.map((p, i) => {
      const st = stateOf(p[1], p[1], false, al);
      const prev = i ? pts[i - 1][1] : null;
      return '<circle cx="' + X(p[0]).toFixed(1) + '" cy="' + Y(p[1]).toFixed(1) + '" r="4" class="pt ' + st + '"><title>' +
             esc(ch + " · " + when(p[0]) + (p[2] ? " · " + p[2] : "") + "\n" + (prev == null ? "first reading " : "₹" + Math.round(prev) + " → ") +
             "₹" + Math.round(p[1]) + (al ? "  (" + pct(p[1], al) + " vs " + lab + ")" : "")) + "</title></circle>";
    }).join("");
    const cur = pts[pts.length - 1][1], st = stateOf(cur, cur, false, al);
    h += '<div class="hrow"><div class="hch">' + logoImg(ch) + "<span>" + esc(ch) + "</span></div>" +
         '<svg viewBox="0 0 ' + W + " " + H + '" width="' + W + '" height="' + H + '" class="spark" role="img" aria-label="' + esc(ch) + ' price over time">' +
         (al != null ? '<line x1="0" x2="' + W + '" y1="' + Y(al).toFixed(1) + '" y2="' + Y(al).toFixed(1) + '" class="alline"/>' : "") +
         '<path d="' + d + '" class="step"/>' + dots + "</svg>" +
         '<div class="hnow"><b class="' + (st === "low" || st === "high" ? st + "t" : "") + '">' + rs(cur) + "</b><small>" +
         (pts.length - 1 ? (pts.length - 1) + " change" + (pts.length > 2 ? "s" : "") : "no change") + "</small></div></div>";
  });
  h += '</div><div class="haxis"><span>' + when(all.reduce((a, p) => p[0] < a ? p[0] : a, all[0][0])) +
       "</span><span>" + when(DATA.updated) + "</span></div>";
  // change log
  const log = [];
  chans.forEach(ch => r.hist[ch].forEach((p, i) => log.push({ch, t: p[0], city: p[2], from: i ? r.hist[ch][i - 1][1] : null, to: p[1]})));
  log.sort((a, b) => b.t.localeCompare(a.t) || a.ch.localeCompare(b.ch));
  h += '<div class="lbl">Every price change (newest first)</div><table class="ctab hlog"><thead><tr><th class="lft">When</th><th class="lft">Channel</th>' +
       '<th class="lft">City</th><th>From</th><th>To</th><th>Change</th><th>vs ' + lab + "</th></tr></thead><tbody>";
  log.forEach(x => {
    const ch = x.from == null ? "first reading" : (x.to < x.from ? "▼ " : "▲ ") + "₹" + Math.abs(Math.round(x.to - x.from));
    const st = stateOf(x.to, x.to, false, al);
    h += '<tr><td class="lft">' + when(x.t) + '</td><td class="lft">' + logoImg(x.ch) + " " + esc(x.ch) + '</td><td class="lft">' + esc(x.city || "All India") +
         "</td><td>" + (x.from == null ? "–" : rs(x.from)) + '</td><td class="' + grade(x.to, x.to, false, al) + '">' + rs(x.to) + "</td><td>" + ch + "</td><td>" +
         (al ? pct(x.to, al) : "–") + "</td></tr>";
  });
  $("history").innerHTML = h + "</tbody></table>";
}

function render() {
  const t = $("t");
  if (!DATA || !DATA.rows.length) { t.innerHTML = "<tr><td>No prices yet - run the tracker first.</td></tr>"; return; }
  const lab = MODE === "bau" ? "BAU" : "Event";
  $("meta").textContent = "Updated " + DATA.updated + "  \u00B7  Comparing with: " + lab;
  const rows = shown();
  $("count").textContent = "Showing " + rows.length + " SKUs";
  if (VIEW === "cul") { renderCulprits(rows); return; }
  if (VIEW === "his") { renderHistory(rows); return; }
  if (MOBILE()) { renderCards(rows); return; }
  let h = "";
  if (VIEW === "all") {
    h = '<thead><tr><th>NH SKU</th><th class="lft">Category</th><th>' + (MODE === "bau" ? "BAU" : "Event") + '</th>';
    DATA.channels.forEach(c => h += logoTh(c, ""));
    h += "<th>Mismatch</th></tr></thead><tbody>";
    rows.forEach(r => {
      h += '<tr><td title="' + esc(r.name) + '">' + esc(r.sku) + rkb(r) + '</td><td class="cat">' + esc(r.cat || "") +
           '</td><td class="al">' + (AL(r) == null ? "\u2013" : rs(AL(r))) + "</td>";
      DATA.channels.forEach(ch => {
        const c = r.cells[ch];
        h += '<td class="' + (!c ? "none" : grade(c[0], c[1], c[2], AL(r))) + '"' + (c ? ' title="' + esc(c[3] + (c[2] ? "" : gapTxt(c[1] > (AL(r) || 0) ? c[1] : c[0], AL(r)))) + '"' : "") + ">" + cellText(c) + "</td>";
      });
      h += '<td class="cnt">' + (r.bad || "") + "</td></tr>";
    });
  } else {
    const cols = qcCols(), apps = [...new Set(cols.map(c => c.ch))];
    h = '<thead><tr class="r1"><th rowspan="2">NH SKU</th><th rowspan="2" class="lft">Category</th><th rowspan="2">' + (MODE === "bau" ? "BAU" : "Event") + '</th>';
    apps.forEach(a => h += logoTh(a, ' colspan="' + cols.filter(c => c.ch === a).length + '" style="border-left:2px solid var(--line)"'));
    h += '<th rowspan="2">Mismatch</th></tr><tr class="r2">';
    cols.forEach((c, i) => h += '<th class="city' + (i === 0 || cols[i - 1].ch !== c.ch ? " gl" : "") + '" title="' + c.pin + '">' + esc(c.label) + "</th>");
    h += "</tr></thead><tbody>";
    rows.forEach(r => {
      h += '<tr><td title="' + esc(r.name) + '">' + esc(r.sku) + rkb(r) + '</td><td class="cat">' + esc(r.cat || "") +
           '</td><td class="al">' + (AL(r) == null ? "\u2013" : rs(AL(r))) + "</td>";
      cols.forEach((c, i) => {
        const v = (r.qc[c.ch] || {})[c.pin];
        const gl = i === 0 || cols[i - 1].ch !== c.ch ? " gl" : "";
        h += '<td class="' + (!v ? "none" : grade(v[0], v[0], v[1], AL(r))) + gl + '" title="' + esc(c.ch + " \u00B7 " + c.label + " " + c.pin + (v && !v[1] ? gapTxt(v[0], AL(r)) : "")) + '">' +
             (!v ? "\u2013" : v[1] ? "OOS" : rs(v[0])) + "</td>";
      });
      h += '<td class="cnt">' + (r.bad || "") + "</td></tr>";
    });
  }
  t.innerHTML = h + "</tbody>";
}

// ---- Download: a clean Excel file (numbers stay numbers, one value per cell)
//   Sheet "Summary"  one row per NH SKU, one price column per channel (lowest price)
//   Sheet "Details"  one row per NH SKU x channel x city - easy to filter / pivot
function dlTables() {
  const lab = MODE === "bau" ? "BAU" : "Event", rows = shown(), qcSet = new Set(DATA.qcApps || []);
  const num = v => v == null || v === "" ? null : Math.round(v);
  const pc = (p, al) => p == null || !al ? null : Math.round((p - al) / al * 1000) / 1000;
  const sumHead = ["NH SKU", "Revenue rank", "Category", "Product", lab + " price"]
    .concat(DATA.channels, ["Lowest price", "Lowest on", "Channels below", "Channels above", "Channels at par", "Out of stock"]);
  const sum = [sumHead];
  const detHead = ["NH SKU", "Revenue rank", "Category", "Product", "Channel", "Type", "City", "Pincode",
                   "Price", lab + " price", "Difference (Rs)", "Difference %", "Status"];
  const det = [detHead];
  const cols = VIEW === "qc" ? qcCols() : null;
  rows.forEach(r => {
    const al = num(AL(r)), line = [r.sku, r.rank == null ? null : r.rank, r.cat || "", r.name || "", al];
    let low = null, lowOn = [], nb = 0, na = 0, np = 0, no = 0;
    DATA.channels.forEach(ch => {
      const c = r.cells[ch];
      if (!c) { line.push(null); return; }
      if (c[2]) { line.push(null); no++; return; }
      const p = num(c[0]); line.push(p);
      if (low == null || p < low) { low = p; lowOn = [ch]; } else if (p === low) lowOn.push(ch);
      const st = cellState(r, c); if (st === "low") nb++; else if (st === "high") na++; else if (st === "ok") np++;
    });
    sum.push(line.concat([low, lowOn.join(", "), nb, na, np, no]));
    const add = (ch, city, pin, price, oos) => {
      const p = num(price), st = stateOf(price, price, oos, AL(r));
      det.push([r.sku, r.rank == null ? null : r.rank, r.cat || "", r.name || "", ch, qcSet.has(ch) ? "QC" : "Marketplace",
                city, pin, oos ? null : p, al, oos || al == null || p == null ? null : p - al, oos ? null : pc(p, al), STATE[st]]);
    };
    DATA.channels.forEach(ch => {
      if (qcSet.has(ch)) {
        (DATA.pins || []).forEach(pn => {
          if (cols && !cols.some(x => x.ch === ch && x.pin === pn.pin)) return;
          const v = (r.qc[ch] || {})[pn.pin]; if (v) add(ch, pn.city || "", pn.pin, v[0], v[1]);
        });
      } else if (!cols) {
        const c = r.cells[ch]; if (c) add(ch, "All India", "", c[0], c[2]);
      }
    });
  });
  return {sum, det, lab};
}
function loadXLSX() {
  return new Promise((ok, bad) => {
    if (window.XLSX) return ok(window.XLSX);
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    sc.onload = () => ok(window.XLSX); sc.onerror = bad; document.head.appendChild(sc);
  });
}
function download() {
  const {sum, det, lab} = dlTables();
  const name = "NH_Price_War_" + (VIEW === "qc" ? "QC_citywise_" : "") + lab + "_" + (DATA.updated || "").replace(/[: ]/g, "-");
  loadXLSX().then(X => {
    const wb = X.utils.book_new();
    const sheet = (aoa, widths, money, pcts) => {
      const ws = X.utils.aoa_to_sheet(aoa);
      ws["!cols"] = widths.map(w => ({wch: w}));
      ws["!autofilter"] = {ref: X.utils.encode_range({s: {r: 0, c: 0}, e: {r: aoa.length - 1, c: aoa[0].length - 1}})};
      for (let i = 1; i < aoa.length; i++) {
        money.forEach(c => { const a = ws[X.utils.encode_cell({r: i, c})]; if (a && a.t === "n") a.z = '"₹"#,##0;-"₹"#,##0'; });
        pcts.forEach(c => { const a = ws[X.utils.encode_cell({r: i, c})]; if (a && a.t === "n") a.z = "0%"; });
      }
      return ws;
    };
    const n = DATA.channels.length, money = [4].concat(DATA.channels.map((_, i) => 5 + i), [5 + n]);
    X.utils.book_append_sheet(wb, sheet(sum, [16, 8, 16, 38, 11].concat(DATA.channels.map(() => 11), [12, 20, 10, 10, 10, 10]), money, []), "Summary");
    X.utils.book_append_sheet(wb, sheet(det, [16, 8, 16, 38, 12, 12, 12, 9, 9, 11, 14, 12, 16], [8, 9, 10], [11]), "Details");
    const how = [["How to read this file"], [""],
      ["Summary", "One row per NH SKU. Each channel column = lowest selling price now (blank = not listed or out of stock)."],
      ["Details", "One row per NH SKU x channel x city. Use filters / pivot on it."],
      ["Difference (Rs)", "Price minus " + lab + " price. Negative = cheaper than " + lab + "."],
      ["Difference %", "Difference as a % of the " + lab + " price."],
      ["Status", "Below / Above / At par (within Rs " + TOL + ") / Out of stock"],
      ["Data as of", DATA.updated || ""]];
    const hw = X.utils.aoa_to_sheet(how); hw["!cols"] = [{wch: 16}, {wch: 100}];
    X.utils.book_append_sheet(wb, hw, "How to read");
    X.writeFile(wb, name + ".xlsx");
  }).catch(() => {                                  // no internet: plain CSV of the Details sheet
    const q = v => v == null ? "" : (typeof v === "number" ? String(v) : '"' + String(v).replace(/"/g, '""') + '"');
    const blob = new Blob(["﻿" + det.map(r => r.map(q).join(",")).join("\r\n")], {type: "text/csv;charset=utf-8"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
  });
}
$("dl").onclick = download;
setupFilters();
render();
window.matchMedia("(max-width: 700px)").addEventListener("change", render);
if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) {
  const k = $("katanas"); k.pauseAnimations(); k.setCurrentTime(1.2);
}
