<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price War</title>
<style>
  :root {
    --bg: #ffffff; --text: #1f2328; --muted: #6b7280; --line: #e5e7eb; --head: #f6f7f9;
    --low-bg: #fde2e1; --low-tx: #a4161a; --high-bg: #fff0cc; --high-tx: #8a5a00;
    --oos-tx: #9ca3af; --btn: #1f2328; --btn-tx: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c; --text: #e8eaed; --muted: #9aa0a6; --line: #2c2f35; --head: #1e2126;
      --low-bg: #4a1f22; --low-tx: #ffb3b0; --high-bg: #44360f; --high-tx: #ffd77a;
      --oos-tx: #6b7280; --btn: #e8eaed; --btn-tx: #16181c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 16px 20px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 64px; height: 48px; flex: none; }
  .brand .nh { height: 54px; width: auto; flex: none; }
  .brand .sep { width: 1px; height: 40px; background: var(--line); margin: 0 4px; }
  h1 { font-size: 22px; margin: 0; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; }
  h1 small { display: block; font-size: 11px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); }
  .meta { color: var(--muted); font-size: 13px; flex: 1 1 220px; min-width: 0; }
  .right { display: flex; align-items: center; gap: 16px; margin-left: auto; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
  button { background: var(--btn); color: var(--btn-tx); border: 0; border-radius: 6px;
           padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 0 20px 12px; font-size: 13px; color: var(--muted); }
  .filters label { display: inline-flex; align-items: center; gap: 8px; }
  .filters select, .filters input { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
                                    border-radius: 6px; padding: 6px 10px; min-width: 190px; }
  .filters .clear { background: none; color: var(--muted); border: 1px solid var(--line); font-weight: 500; padding: 6px 12px; }
  td.cat { color: var(--muted); text-align: left; }
  .wrap { overflow: auto; max-height: calc(100vh - 175px); border-top: 1px solid var(--line); }
  table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
  th, td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--head); font-weight: 600; z-index: 2; }
  th:first-child, td:first-child { position: sticky; left: 0; text-align: left; background: var(--bg); z-index: 1; }
  th:first-child { background: var(--head); z-index: 3; }
  td:first-child { font-weight: 600; }
  td.al { color: var(--muted); }
  td.low { background: var(--low-bg); color: var(--low-tx); font-weight: 600; }
  td.high { background: var(--high-bg); color: var(--high-tx); font-weight: 600; }
  .low1 { background: #fde8e7 !important; color: #a4161a !important; }
  .low2 { background: #f9c3bf !important; color: #8f1317 !important; }
  .low3 { background: #f08a83 !important; color: #5c0b0e !important; }
  .low4 { background: #d63a31 !important; color: #ffffff !important; }
  .high1 { background: #fff4d6 !important; color: #7a5200 !important; }
  .high2 { background: #ffe29a !important; color: #6b4700 !important; }
  .high3 { background: #ffc24d !important; color: #4d3300 !important; }
  .high4 { background: #f08c00 !important; color: #ffffff !important; }
  td.low1, td.low2, td.low3, td.low4, td.high1, td.high2, td.high3, td.high4 { font-weight: 600; }
  .scale { display: inline-flex; gap: 2px; margin-left: 4px; }
  .scale i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
  td.oos { color: var(--oos-tx); }
  td.none { color: var(--oos-tx); }
  td.cnt { font-weight: 600; }
  tr:hover td { filter: brightness(0.97); }
  th.logo { text-align: center; padding: 6px 12px; }
  .lg { position: relative; display: inline-block; height: 30px; vertical-align: middle; }
  .lg img { width: auto; max-width: 60px; height: 30px; border-radius: 7px; object-fit: contain; background: #fff;
            box-shadow: 0 0 0 1px var(--line); }
  .lg .bolt { position: absolute; right: -7px; bottom: -5px; width: 16px; height: 16px; border-radius: 50%;
              background: #ffd23f; color: #1f2328; font-size: 10px; line-height: 16px; text-align: center;
              box-shadow: 0 0 0 2px var(--head); }
  .tabs { display: flex; gap: 4px; padding: 0 20px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .tab { background: none; color: var(--muted); border-radius: 0; padding: 10px 14px; font-weight: 600;
         border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab.on { color: var(--text); border-bottom-color: var(--text); }
  .qconly { display: none !important; }
  body.qcview .qconly { display: inline-flex !important; }
  th.lft { text-align: left; }
  thead tr.r2 th { top: 43px; font-weight: 500; font-size: 12px; color: var(--muted); }
  th.gl, td.gl { border-left: 2px solid var(--line); }
  th[rowspan] { vertical-align: middle; }
  .seg { display: inline-flex; align-items: center; }
  .seg .sg { background: var(--bg); color: var(--muted); border: 1px solid var(--line); border-radius: 0; padding: 6px 12px; font-weight: 600; }
  .seg .sg:first-of-type { border-radius: 6px 0 0 6px; margin-left: 8px; }
  .seg .sg:last-of-type { border-radius: 0 6px 6px 0; border-left: 0; }
  .seg .sg.on { background: var(--btn); color: var(--btn-tx); border-color: var(--btn); }
  .rk { font-size: 11px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 0 6px; margin-left: 4px; }
  .rk.t50 { color: #1a7f37; border-color: #9fd5ae; }
  #cards { display: none; }
  @media (max-width: 700px) {
    header { padding: 12px 16px; gap: 8px 12px; }
    .brand .nh { height: 40px; } .brand svg { width: 44px; height: 34px; } h1 { font-size: 18px; }
    .meta { flex-basis: 100%; font-size: 12px; order: 3; }
    .right { margin-left: 0; width: 100%; justify-content: space-between; order: 4; }
    .legend { gap: 10px; font-size: 12px; flex-wrap: wrap; }
    .tabs { padding: 0 8px; overflow-x: auto; } .tab { padding: 10px; white-space: nowrap; }
    .filters { padding: 0 16px 12px; gap: 8px; }
    .filters label { width: 100%; justify-content: space-between; }
    .filters select, .filters input { min-width: 0; flex: 1; }
    .seg { width: 100%; } .seg .sg { flex: 1; }
    .wrap { display: none; }
    #cards { display: block; padding: 0 12px 24px; }
    .card { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: var(--bg); }
    .card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .card .sku { font-weight: 700; font-size: 15px; }
    .card .sub { color: var(--muted); font-size: 12px; margin: 2px 0 10px; }
    .card .bad { font-size: 12px; font-weight: 700; color: var(--low-tx); white-space: nowrap; }
    .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
    .chip { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 5px 7px; font-weight: 600; font-size: 13px; }
    .chip img { height: 20px; width: auto; max-width: 36px; border-radius: 4px; background: #fff; }
    .chip.low { background: var(--low-bg); color: var(--low-tx); border-color: transparent; }
    .chip.high { background: var(--high-bg); color: var(--high-tx); border-color: transparent; }
    .chip.oos { color: var(--oos-tx); }
    .app { display: flex; align-items: center; gap: 8px; margin: 8px 0 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
    .app img { height: 20px; width: auto; max-width: 36px; border-radius: 4px; background: #fff; }
  }
  th.sortable { cursor: pointer; }
  th.sortable:hover { background: var(--line); }
  th.sorted { box-shadow: inset 0 -3px 0 var(--text); }
  th .arrow { display: block; font-size: 9px; line-height: 10px; color: var(--text); }
</style>
</head>

let VIEW = "all", MODE = "event", SORTCH = "";
const TOL = (DATA && DATA.tol != null) ? DATA.tol : 1;
const $ = id => document.getElementById(id);
const R0 = v => v == null || v === "" ? "" : Math.round(v);
const rs = v => v == null ? "" : "\u20B9" + Math.round(v);
const AL = r => MODE === "bau" ? r.alb : r.ale;
function stateOf(lo, hi, oos, al) {
  if (oos) return "oos";
  if (al == null) return "na";
  if (lo < al - TOL) return "low";
  if (hi > al + TOL) return "high";
  return "ok";
}
const cellState = (r, c) => stateOf(c[0], c[1], c[2], AL(r));
const qcState = (r, v) => stateOf(v[0], v[0], v[1], AL(r));
const cellText = c => !c ? "\u2013" : (c[2] ? "OOS" : (R0(c[0]) === R0(c[1]) ? rs(c[0]) : rs(c[0]) + "\u2013" + R0(c[1])));
const OFF = s => s === "low" || s === "high";
const STATE = {low: "Below", high: "Above", oos: "Out of stock", ok: "At par", na: "No Event/BAU price"};
// how far from the Event/BAU price, as a share of it -> colour step 1..4
function grade(lo, hi, oos, al) {
  const st = stateOf(lo, hi, oos, al);
  if (st !== "low" && st !== "high") return st === "oos" ? "oos" : "";
  const gap = st === "low" ? (al - lo) / al : (hi - al) / al;
  const step = gap < 0.05 ? 1 : gap < 0.10 ? 2 : gap < 0.20 ? 3 : 4;
  return st + " " + st + step;
}
const gapTxt = (p, al) => al ? " (" + (p >= al ? "+" : "") + Math.round((p - al) / al * 100) + "% vs " + (MODE === "bau" ? "BAU" : "Event") + ")" : "";
function esc(s) { return String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }
function rkb(r) { return r.rank == null ? "" : ' <span class="rk' + (r.tier === "Top 50" ? " t50" : "") + '" title="October revenue rank">#' + r.rank + "</span>"; }
function cls(st) { return st === "low" || st === "high" || st === "oos" ? st : ""; }
function logoTh(c, extra) {
  const L = DATA.logos || {};
  const on = SORTCH === c ? " sorted" : "";
  const tip = ' title="' + esc(c) + ' \u2013 click to sort by ' + esc(c) + ' sales and mismatches (click again to undo)"';
  const inner = L[c] ? '<span class="lg"><img src="' + L[c] + '" alt="' + esc(c) + '"></span>' : esc(c);
  return '<th class="logo sortable' + on + '" data-ch="' + esc(c) + '"' + extra + tip + ">" + inner +
         (on ? '<span class="arrow">\u25BC</span>' : "") + "</th>";
}

// ---- columns of the current view: [{ch, pin, label}]
function qcCols() {
  const app = $("fapp").value, city = $("fcity").value, out = [];
  (DATA.qcApps || []).filter(a => !app || a === app).forEach(a =>
    (DATA.pins || []).filter(p => !city || p.pin === city).forEach(p => out.push({ch: a, pin: p.pin, label: p.city || p.pin})));
  return out;
}
function qcBad(r, cols) { return cols.filter(c => { const v = (r.qc[c.ch] || {})[c.pin]; return v && OFF(qcState(r, v)); }).length; }
function allBad(r) { return DATA.channels.filter(ch => r.cells[ch] && OFF(cellState(r, r.cells[ch]))).length; }

function shown() {
  const c = $("fcat").value, k = $("fsku").value.trim().toUpperCase(), pr = $("fpri").value;
  const hasTier = DATA.rows.some(r => r.tier);
  const inPri = r => !hasTier || pr === "all" || (pr === "50" ? r.tier === "Top 50" : (r.tier === "Top 50" || r.tier === "80% revenue"));
  let rows = DATA.rows.filter(r => inPri(r) && (!c || r.cat === c) && (!k || r.sku.toUpperCase().includes(k)));
  if (VIEW === "qc") {
    const cols = qcCols();
    rows = rows.filter(r => cols.some(x => (r.qc[x.ch] || {})[x.pin])).map(r => Object.assign({}, r, {bad: qcBad(r, cols)}));
  } else {
    rows = rows.map(r => Object.assign({}, r, {bad: allBad(r)}));
  }
  const rk = r => r.rank == null ? 99999 : r.rank;
  if (SORTCH) {
    // clicked channel: SKUs off the aligned price THERE first, then by that channel's own sales rank
    const ch = SORTCH, cols = VIEW === "qc" ? qcCols().filter(c => c.ch === ch) : [];
    const off = r => VIEW === "qc" ? cols.filter(c => { const v = (r.qc[ch] || {})[c.pin]; return v && OFF(qcState(r, v)); }).length
                                   : (r.cells[ch] && OFF(cellState(r, r.cells[ch])) ? 1 : 0);
    const has = r => VIEW === "qc" ? (cols.some(c => (r.qc[ch] || {})[c.pin]) ? 1 : 0) : (r.cells[ch] ? 1 : 0);
    const cr = r => (r.cr || {})[ch] || 99999;
    return rows.sort((a, b) => off(b) - off(a) || has(b) - has(a) || cr(a) - cr(b) || b.bad - a.bad || rk(a) - rk(b));
  }
  return rows.sort((a, b) => b.bad - a.bad || (AL(a) == null) - (AL(b) == null) || rk(a) - rk(b) || a.sku.localeCompare(b.sku));
}

function setupFilters() {
  if (!DATA || !DATA.rows.length) return;
  const cats = [...new Set(DATA.rows.map(r => r.cat).filter(Boolean))].sort();
  $("fcat").innerHTML += cats.map(c => "<option>" + esc(c) + "</option>").join("");
  $("skulist").innerHTML = DATA.rows.map(r => '<option value="' + esc(r.sku) + '">').join("");
  $("fapp").innerHTML += (DATA.qcApps || []).map(a => "<option>" + esc(a) + "</option>").join("");
  $("fcity").innerHTML += (DATA.pins || []).map(p => '<option value="' + p.pin + '">' + esc((p.city || "") + " " + p.pin) + "</option>").join("");
  ["fcat", "fapp", "fcity", "fpri"].forEach(id => $(id).onchange = render);
  $("fsort").innerHTML += DATA.channels.map(c => '<option value="' + esc(c) + '">' + esc(c) + " \u2013 sales & mismatch</option>").join("");
  $("fsort").onchange = () => { SORTCH = $("fsort").value; render(); };
  $("t").addEventListener("click", e => {
    const th = e.target.closest("th[data-ch]");
    if (!th) return;
    SORTCH = SORTCH === th.dataset.ch ? "" : th.dataset.ch;
    $("fsort").value = SORTCH;
    render();
  });
  $("fsku").oninput = render;
  $("fclear").onclick = () => { ["fcat", "fsku", "fapp", "fcity", "fsort"].forEach(id => $(id).value = ""); SORTCH = ""; $("fpri").value = "80"; render(); };
  document.querySelectorAll(".sg").forEach(b => b.onclick = () => {
    MODE = b.dataset.m;
    document.querySelectorAll(".sg").forEach(x => x.classList.toggle("on", x === b));
    render();
  });
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
    VIEW = b.dataset.v;
    document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b));
    document.body.classList.toggle("qcview", VIEW === "qc");
    render();
  });
}

const MOBILE = () => window.matchMedia("(max-width: 700px)").matches;
function logoImg(c) { const L = DATA.logos || {}; return L[c] ? '<img src="' + L[c] + '" alt="' + esc(c) + '" title="' + esc(c) + '">' : esc(c); }
function renderCards(rows) {
  let h = "";
  const shown = rows.slice(0, 300);
  shown.forEach(r => {
    h += '<div class="card"><div class="top"><span class="sku">' + esc(r.sku) + rkb(r) + "</span>" +
         (r.bad ? '<span class="bad">' + r.bad + (r.bad > 1 ? " mismatches" : " mismatch") + "</span>" : "") + "</div>" +
         '<div class="sub">' + esc(r.cat || "") + (r.cat ? " \u00B7 " : "") + (MODE === "bau" ? "BAU " : "Event ") + (AL(r) == null ? "\u2013" : rs(AL(r))) + "</div>";
    if (VIEW === "all") {
      h += '<div class="chips">';
      DATA.channels.forEach(ch => { const c = r.cells[ch]; if (!c) return;
        h += '<span class="chip ' + grade(c[0], c[1], c[2], AL(r)) + '" title="' + esc(c[3]) + '">' + logoImg(ch) + cellText(c) + "</span>"; });
      h += "</div>";
    } else {
      const cols = qcCols();
      [...new Set(cols.map(c => c.ch))].forEach(a => {
        const cs = cols.filter(c => c.ch === a && (r.qc[a] || {})[c.pin]);
        if (!cs.length) return;
        h += '<div class="app">' + logoImg(a) + esc(a) + '</div><div class="chips">';
        cs.forEach(c => { const v = r.qc[a][c.pin];
          h += '<span class="chip ' + grade(v[0], v[0], v[1], AL(r)) + '">' + esc(c.label) + " " + (v[1] ? "OOS" : rs(v[0])) + "</span>"; });
        h += "</div>";
      });
    }
    h += "</div>";
  });
  if (rows.length > shown.length) h += '<p class="sub">Showing first 300 - use the filters to narrow down.</p>';
  $("cards").innerHTML = h || '<p class="sub">No SKUs match the filters.</p>';
}

function render() {
  const t = $("t");
  if (!DATA || !DATA.rows.length) { t.innerHTML = "<tr><td>No prices yet - run the tracker first.</td></tr>"; return; }
  const lab = MODE === "bau" ? "BAU" : "Event";
  $("meta").textContent = "Updated " + DATA.updated + "  \u00B7  Comparing with: " + lab;
  const rows = shown();
  $("count").textContent = "Showing " + rows.length + " SKUs";
  if (MOBILE()) { renderCards(rows); return; }
  let h = "";
  if (VIEW === "all") {
    h = '<thead><tr><th>NH SKU</th><th class="lft">Category</th><th>' + (MODE === "bau" ? "BAU" : "Event") + '</th>';
    DATA.channels.forEach(c => h += logoTh(c, ""));
    h += "<th>Mismatch</th></tr></thead><tbody>";
    rows.forEach(r => {
      h += '<tr><td title="' + esc(r.name) + '">' + esc(r.sku) + rkb(r) + '</td><td class="cat">' + esc(r.cat || "") +
           '</td><td class="al">' + (AL(r) == null ? "\u2013" : rs(AL(r))) + "</td>";
      DATA.channels.forEach(ch => {
        const c = r.cells[ch];
        h += '<td class="' + (!c ? "none" : grade(c[0], c[1], c[2], AL(r))) + '"' + (c ? ' title="' + esc(c[3] + (c[2] ? "" : gapTxt(c[1] > (AL(r) || 0) ? c[1] : c[0], AL(r)))) + '"' : "") + ">" + cellText(c) + "</td>";
      });
      h += '<td class="cnt">' + (r.bad || "") + "</td></tr>";
    });
  } else {
    const cols = qcCols(), apps = [...new Set(cols.map(c => c.ch))];
    h = '<thead><tr class="r1"><th rowspan="2">NH SKU</th><th rowspan="2" class="lft">Category</th><th rowspan="2">' + (MODE === "bau" ? "BAU" : "Event") + '</th>';
    apps.forEach(a => h += logoTh(a, ' colspan="' + cols.filter(c => c.ch === a).length + '" style="border-left:2px solid var(--line)"'));
    h += '<th rowspan="2">Mismatch</th></tr><tr class="r2">';
    cols.forEach((c, i) => h += '<th class="city' + (i === 0 || cols[i - 1].ch !== c.ch ? " gl" : "") + '" title="' + c.pin + '">' + esc(c.label) + "</th>");
    h += "</tr></thead><tbody>";
    rows.forEach(r => {
      h += '<tr><td title="' + esc(r.name) + '">' + esc(r.sku) + rkb(r) + '</td><td class="cat">' + esc(r.cat || "") +
           '</td><td class="al">' + (AL(r) == null ? "\u2013" : rs(AL(r))) + "</td>";
      cols.forEach((c, i) => {
        const v = (r.qc[c.ch] || {})[c.pin];
        const gl = i === 0 || cols[i - 1].ch !== c.ch ? " gl" : "";
        h += '<td class="' + (!v ? "none" : grade(v[0], v[0], v[1], AL(r))) + gl + '" title="' + esc(c.ch + " \u00B7 " + c.label + " " + c.pin + (v && !v[1] ? gapTxt(v[0], AL(r)) : "")) + '">' +
             (!v ? "\u2013" : v[1] ? "OOS" : rs(v[0])) + "</td>";
      });
      h += '<td class="cnt">' + (r.bad || "") + "</td></tr>";
    });
  }
  t.innerHTML = h + "</tbody>";
}

function download() {
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const rows = shown(), lines = [];
  if (VIEW === "all") {
    const head = ["NH SKU", "Revenue rank", "Category", "Product", (MODE === "bau" ? "BAU SP" : "Event SP")];
    DATA.channels.forEach(c => head.push(c + " Price", c + " Status"));
    head.push("Channels mismatched");
    lines.push(head.map(q).join(","));
    rows.forEach(r => {
      const row = [r.sku, r.rank, r.cat, r.name, R0(AL(r))];
      DATA.channels.forEach(ch => { const c = r.cells[ch];
        row.push(!c ? "" : (R0(c[0]) === R0(c[1]) ? R0(c[0]) : R0(c[0]) + "-" + R0(c[1])), !c ? "Not listed" : STATE[cellState(r, c)]); });
      row.push(r.bad); lines.push(row.map(q).join(","));
    });
  } else {
    const cols = qcCols(), head = ["NH SKU", "Revenue rank", "Category", "Product", (MODE === "bau" ? "BAU SP" : "Event SP")];
    cols.forEach(c => head.push(c.ch + " " + c.label + " " + c.pin + " Price", c.ch + " " + c.label + " " + c.pin + " Status"));
    head.push("Mismatches"); lines.push(head.map(q).join(","));
    rows.forEach(r => {
      const row = [r.sku, r.rank, r.cat, r.name, R0(AL(r))];
      cols.forEach(c => { const v = (r.qc[c.ch] || {})[c.pin]; row.push(v ? R0(v[0]) : "", v ? STATE[qcState(r, v)] : "Not listed"); });
      row.push(r.bad); lines.push(row.map(q).join(","));
    });
  }
  const blob = new Blob(["\uFEFF" + lines.join("\r\n")], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "NH_Price_War_" + (VIEW === "qc" ? "QC_citywise_" : "") + MODE.toUpperCase() + "_" + (DATA.updated || "").replace(/[: ]/g, "-") + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
}
$("dl").onclick = download;
setupFilters();
render();
window.matchMedia("(max-width: 700px)").addEventListener("change", render);
if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) {
  const k = $("katanas"); k.pauseAnimations(); k.setCurrentTime(1.2);
}
</script>
</body>
</html>
